

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SafeZone{% endblock %}</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            background: #080f1e;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 255px;
            background: linear-gradient(180deg, #101d33, #080f1e);
            padding: 25px 17px;
            box-sizing: border-box;
            flex-shrink: 0;
            border-right: 1px solid rgba(56,189,248,0.18);
            box-shadow: 5px 0 25px rgba(0,0,0,0.25);
        }

        /* BRAND */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px 25px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(148,163,184,0.15);
        }

        .brand-icon {
            animation: shieldSpin 5s linear infinite;
            transform-style: preserve-3d;
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg,#0284c7,#06b6d4);
            font-size: 23px;
            box-shadow: 0 0 20px rgba(6,182,212,0.35);
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            color: #e0f2fe;
            letter-spacing: 1px;
        }

        .brand-name span {
            color: #22d3ee;
        }

        .sidebar-label {
            color: #64748b;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: bold;
            padding: 0 12px;
            margin-bottom: 15px;
        }

        /* NAVIGATION */

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 13px;
            margin-bottom: 9px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 11px;
            border: 1px solid transparent;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-icon {
            width: 25px;
            text-align: center;
            font-size: 19px;
        }

        .nav-link:hover {
            color: #67e8f9;
            background: rgba(14,165,233,0.10);
            border-color: rgba(56,189,248,0.25);
            transform: translateX(5px);
        }

        .nav-link.active {
            color: #ffffff;
            background: linear-gradient(90deg,
                rgba(2,132,199,0.35),
                rgba(6,182,212,0.08));
            border: 1px solid rgba(34,211,238,0.35);
            box-shadow: 0 0 18px rgba(6,182,212,0.10);
        }

        .nav-link.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: #22d3ee;
            border-radius: 5px;
            box-shadow: 0 0 12px #22d3ee;
        }

        .nav-link.active .nav-icon {
            filter: drop-shadow(0 0 6px #22d3ee);
        }

        /* FOOTER */

        .sidebar-footer {
            margin-top: 35px;
            padding: 15px 10px;
            border-top: 1px solid rgba(148,163,184,0.15);
            color: #64748b;
            font-size: 11px;
            line-height: 1.8;
        }

        .system-status {
            color: #4ade80;
        }

        /* MAIN CONTENT */

        .main-content {
            flex: 1;
            padding: 30px;
            min-width: 0;
        }

        @media (max-width: 700px) {
            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 15px;
            }

            .brand {
                margin-bottom: 15px;
                padding-bottom: 15px;
            }

            .sidebar nav {
                display: flex;
                flex-wrap: wrap;
                gap: 7px;
            }

            .nav-link {
                flex: 1 1 130px;
                margin: 0;
                padding: 11px;
            }

            .sidebar-label,
            .sidebar-footer {
                display: none;
            }

            .main-content {
                padding: 18px;
            }
        } 
        @keyframes shieldSpin {
    0% {
        transform: perspective(400px) rotateY(0deg);
    }

    50% {
        transform: perspective(400px) rotateY(180deg);
    }

    100% {
        transform: perspective(400px) rotateY(360deg);
    }
}
/* THREE DOT MENU */

.sidebar-toggle {
    transition: opacity 0.3s ease;
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;
    width: 42px;
    height: 42px;
    border: 1px solid #0891b2;
    border-radius: 12px;
    background: #102746;
    color: #22d3ee;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(34,211,238,0.2);
    transition: 0.3s;
}

.sidebar-toggle:hover {
    background: #0284c7;
    color: white;
    transform: scale(1.08);
}

/* SIDEBAR SLIDE ANIMATION */

.sidebar {
    transition: margin-left 0.35s ease;
}

body.sidebar-hidden .sidebar {
    margin-left: -255px;
}

.main-content {
    transition: all 0.35s ease;
}
    </style>
</head>

<body>
    <button id="sidebarToggle" class="sidebar-toggle"
        onclick="toggleSidebar()">⋮</button>

<div class="app-layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🛡</div>
            <div class="brand-name">SAFE<span>ZONE</span></div>
        </div>

        <div class="sidebar-label">MAIN NAVIGATION</div>

        <nav>

            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a href="/map" class="nav-link {% if request.path == '/map' %}active{% endif %}">
                <span class="nav-icon">◉</span>
                Crime Map
            </a>

            <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">
                <span class="nav-icon">▥</span>
                Crime Analytics
            </a>

            <a href="/search" class="nav-link {% if request.path == '/search' %}active{% endif %}">
                <span class="nav-icon">⌕</span>
                Search & Filter
            </a>

            <a href="/records" class="nav-link {% if request.path == '/records' %}active{% endif %}">
                <span class="nav-icon">▤</span>
                Crime Records
            </a>

        </nav>

        <div class="sidebar-footer">
            <div class="system-status">● SYSTEM ONLINE</div>
            SAFEZONE INTELLIGENCE<br>
            Crime Analysis Platform
        </div>

    </aside>

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>
<script>
    document.body.classList.add("sidebar-hidden");

    function toggleSidebar() {
    document.body.classList.toggle("sidebar-hidden");

    const button = document.getElementById("sidebarToggle");

    if (document.body.classList.contains("sidebar-hidden")) {
        button.style.opacity = "1";
        button.style.pointerEvents = "auto";
    } else {
        button.style.opacity = "0";
        button.style.pointerEvents = "none";
    }
}
</script>
</body>
</html>
